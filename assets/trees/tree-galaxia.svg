  <rect x="70" y="120" width="48" height="6" rx="2" fill="#7c3aed" transform="rotate(-25 70 120)"/>
  <rect x="138" y="110" width="48" height="6" rx="2" fill="#7c3aed" transform="rotate(20 138 110)"/>
