<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="legendCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1035;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0720;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="legendBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="legendNebula" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0c0a1a;stop-opacity:0" />
    </radialGradient>
    <filter id="legendGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="280" height="430" rx="16" fill="url(#legendCardGrad)" stroke="url(#legendBorder)" stroke-width="5" filter="url(#legendGlow)"/>
  <rect x="30" y="30" width="240" height="280" rx="8" fill="url(#legendNebula)"/>
  <circle cx="150" cy="170" r="60" fill="#1a1035"/>
  <circle cx="150" cy="155" r="20" fill="#7c3aed"/>
  <ellipse cx="150" cy="200" rx="30" ry="20" fill="#7c3aed"/>
  <rect x="60" y="330" width="180" height="8" rx="4" fill="#1a1035"/>
  <rect x="90" y="350" width="120" height="6" rx="3" fill="#0c0a1a"/>
  <rect x="100" y="380" width="100" height="20" rx="10" fill="url(#legendBorder)" opacity="0.9"/>
  <text x="150" y="394" text-anchor="middle" font-family="Arial" font-size="10" fill="#0c0a1a">Lendária</text>
  <circle cx="30" cy="30" r="10" fill="#fbbf24" opacity="0.8" filter="url(#legendGlow)"/>
  <circle cx="270" cy="30" r="10" fill="#a78bfa" opacity="0.8" filter="url(#legendGlow)"/>
  <circle cx="30" cy="430" r="10" fill="#a78bfa" opacity="0.8" filter="url(#legendGlow)"/>
  <circle cx="270" cy="430" r="10" fill="#fbbf24" opacity="0.8" filter="url(#legendGlow)"/>
  <circle cx="150" cy="20" r="6" fill="#fbbf24" opacity="0.7" filter="url(#legendGlow)"/>
  <circle cx="150" cy="440" r="6" fill="#a78bfa" opacity="0.7" filter="url(#legendGlow)"/>
  <circle cx="20" cy="225" r="5" fill="#fbbf24" opacity="0.5" filter="url(#legendGlow)"/>
  <circle cx="280" cy="225" r="5" fill="#a78bfa" opacity="0.5" filter="url(#legendGlow)"/>
</svg>