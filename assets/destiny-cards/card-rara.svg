<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="rareCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rareBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="rareGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="280" height="430" rx="16" fill="url(#rareCardGrad)" stroke="url(#rareBorder)" stroke-width="3" filter="url(#rareGlow)"/>
  <rect x="30" y="30" width="240" height="280" rx="8" fill="#1e1b4b"/>
  <circle cx="150" cy="170" r="60" fill="#312e81"/>
  <circle cx="150" cy="155" r="20" fill="#4338ca"/>
  <ellipse cx="150" cy="200" rx="30" ry="20" fill="#4338ca"/>
  <rect x="60" y="330" width="180" height="8" rx="4" fill="#312e81"/>
  <rect x="90" y="350" width="120" height="6" rx="3" fill="#1e1b4b"/>
  <rect x="100" y="380" width="100" height="20" rx="10" fill="#fbbf24" opacity="0.9"/>
  <text x="150" y="394" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e1b4b">Rara</text>
  <circle cx="30" cy="30" r="8" fill="#fbbf24" opacity="0.6"/>
  <circle cx="270" cy="30" r="8" fill="#fbbf24" opacity="0.6"/>
  <circle cx="30" cy="430" r="8" fill="#fbbf24" opacity="0.6"/>
  <circle cx="270" cy="430" r="8" fill="#fbbf24" opacity="0.6"/>
</svg>