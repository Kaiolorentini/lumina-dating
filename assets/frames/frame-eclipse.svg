<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="eclipseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eclipseRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.5" />
    </linearGradient>
    <filter id="eclipseGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#eclipseGrad)" stroke-width="10"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#eclipseRing)" stroke-width="3" filter="url(#eclipseGlow)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <circle cx="140" cy="60" r="20" fill="#1e1b4b" opacity="0.8"/>
  <circle cx="140" cy="60" r="22" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
</svg>