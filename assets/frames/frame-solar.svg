<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="solarGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#solarGrad)" stroke-width="8" filter="url(#solarGlow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="5" x2="100" y2="20" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <line x1="100" y1="180" x2="100" y2="195" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <line x1="5" y1="100" x2="20" y2="100" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <line x1="180" y1="100" x2="195" y2="100" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <line x1="33" y1="33" x2="44" y2="44" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <line x1="156" y1="156" x2="167" y2="167" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <line x1="167" y1="33" x2="156" y2="44" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <line x1="44" y1="156" x2="33" y2="167" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
</svg>