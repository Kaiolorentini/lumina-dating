<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="constGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="constGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#constGrad)" stroke-width="6"/>
  <circle cx="100" cy="10" r="4" fill="#c7d2fe" filter="url(#constGlow)"/>
  <circle cx="150" cy="25" r="3" fill="#a5b4fc" filter="url(#constGlow)"/>
  <circle cx="50" cy="25" r="3" fill="#a5b4fc" filter="url(#constGlow)"/>
  <circle cx="175" cy="65" r="3" fill="#c7d2fe" filter="url(#constGlow)"/>
  <circle cx="25" cy="65" r="3" fill="#c7d2fe" filter="url(#constGlow)"/>
  <circle cx="185" cy="100" r="4" fill="#818cf8" filter="url(#constGlow)"/>
  <circle cx="15" cy="100" r="4" fill="#818cf8" filter="url(#constGlow)"/>
  <circle cx="175" cy="135" r="3" fill="#c7d2fe" filter="url(#constGlow)"/>
  <circle cx="25" cy="135" r="3" fill="#c7d2fe" filter="url(#constGlow)"/>
  <circle cx="150" cy="175" r="3" fill="#a5b4fc" filter="url(#constGlow)"/>
  <circle cx="50" cy="175" r="3" fill="#a5b4fc" filter="url(#constGlow)"/>
  <circle cx="100" cy="190" r="4" fill="#c7d2fe" filter="url(#constGlow)"/>
  <line x1="100" y1="10" x2="150" y2="25" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="10" x2="50" y2="25" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="150" y1="25" x2="175" y2="65" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="25" x2="25" y2="65" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
</svg>