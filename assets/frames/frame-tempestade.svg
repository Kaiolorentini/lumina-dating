  <circle cx="150" cy="40" r="10" fill="#e0f2fe" opacity="0.3"/>
  <circle cx="40" cy="140" r="6" fill="#e0f2fe" opacity="0.3"/>
  <circle cx="160" cy="150" r="8" fill="#e0f2fe" opacity="0.2"/>
