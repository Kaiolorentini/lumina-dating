<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="galaxWeekendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0720;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1035;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c0a1a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="galaxWeekendNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0f0720;stop-opacity:0" />
    </radialGradient>
    <filter id="galaxWeekendGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="300" fill="url(#galaxWeekendGrad)"/>
  <circle cx="300" cy="150" r="130" fill="url(#galaxWeekendNebula)"/>
  <circle cx="80" cy="40" r="2" fill="#f8fafc" opacity="0.7"/>
  <circle cx="520" cy="60" r="3" fill="#f8fafc" opacity="0.6"/>
  <circle cx="60" cy="180" r="2" fill="#f8fafc" opacity="0.5"/>
  <circle cx="540" cy="200" r="2" fill="#f8fafc" opacity="0.6"/>
  <circle cx="150" cy="250" r="1.5" fill="#f8fafc" opacity="0.4"/>
  <circle cx="450" cy="260" r="2" fill="#f8fafc" opacity="0.5"/>
  <text x="300" y="110" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="#c4b5fd">GALÁXIA</text>
  <text x="300" y="165" text-anchor="middle" font-family="Arial" font-size="48" font-weight="bold" fill="#fbbf24" filter="url(#galaxWeekendGlow)">WEEKEND</text>
  <text x="300" y="210" text-anchor="middle" font-family="Arial" font-size="16" fill="#a78bfa">Conexões estelares todo fim de semana</text>
  <circle cx="200" cy="250" r="15" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <circle cx="400" cy="250" r="15" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
</svg>